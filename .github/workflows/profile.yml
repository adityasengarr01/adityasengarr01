name: Generate Profile Graphics

on:
  workflow_dispatch:
  push:
    paths:
      - "portrait.jpg.jpeg"
      - "scripts/make_portrait.py"
      - ".github/workflows/profile.yml"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate ASCII portrait
        run: |
          python scripts/make_portrait.py pro.jpg ascii.svg

      - name: Commit generated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ascii.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile graphics"
            git push
          fi
